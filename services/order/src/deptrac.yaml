deptrac:
  paths:
    - ./app
  exclude_files:
    - '#.*test.*#'
    - '#.*Test\.php$#'

  layers:
    - name: Domain
      collectors:
        - type: classLike
          value: ^App\\Domain\\.*

    - name: Application
      collectors:
        - type: classLike
          value: ^App\\Application\\.*

    - name: Infrastructure
      collectors:
        - type: classLike
          value: ^App\\Infrastructure\\.*

    - name: Presentation
      collectors:
        - type: classLike
          value: ^App\\Presentation\\.*

    # Standard Laravel code (Models, Providers, Http, Console).
    # Not subject to DDD rules, but must be allowed to depend on Laravel.
    - name: Laravel
      collectors:
        - type: classLike
          value: ^App\\Models\\.*
        - type: classLike
          value: ^App\\Providers\\.*
        - type: classLike
          value: ^App\\Http\\.*
        - type: classLike
          value: ^App\\Console\\.*

    # Doctrine mapping attributes only (#[ORM\Entity], #[ORM\Column], etc.).
    # These are declarative metadata, not framework behavior.
    # Domain is allowed to use them without polluting itself with ORM logic.
    - name: DoctrineMapping
      collectors:
        - type: classLike
          value: ^Doctrine\\ORM\\Mapping\\.*

    # Framework and third-party libraries.
    # Note: Doctrine\ORM\Mapping is intentionally excluded here
    # (it lives in the DoctrineMapping layer above).
    - name: Framework
      collectors:
        - type: classLike
          value: ^Illuminate\\.*
        - type: classLike
          value: ^Laravel\\.*
        - type: classLike
          value: ^Doctrine\\(?!ORM\\Mapping).*
        - type: classLike
          value: ^Ecotone\\.*
        - type: classLike
          value: ^Symfony\\.*
        - type: classLike
          value: ^Psr\\.*

  ruleset:
    Domain:
      # Domain depends only on itself and Doctrine mapping attributes.
      # No framework behavior, no EntityManager, no DBAL, no repositories.
      - Domain
      - DoctrineMapping

    Application:
      # Application depends only on Domain.
      - Domain
      - Application

    Infrastructure:
      # Infrastructure implements interfaces from Domain/Application.
      - Domain
      - Application
      - Infrastructure
      - Framework
      - DoctrineMapping

    Presentation:
      # Presentation calls use cases from Application.
      - Domain
      - Application
      - Infrastructure
      - Presentation
      - Laravel
      - Framework
      - DoctrineMapping

    Laravel:
      # Standard Laravel code can depend on anything.
      - Domain
      - Application
      - Infrastructure
      - Laravel
      - Framework
      - DoctrineMapping

    DoctrineMapping:
      # Mapping attributes have no dependencies of their own.
      - DoctrineMapping
