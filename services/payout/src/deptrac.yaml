deptrac:
  paths:
    - ./app
  exclude_files:
    - '#.*test.*#'
    - '#.*Test\.php$#'

  layers:
    - name: Domain
      collectors:
        - type: classLike
          value: ^App\\Domain\\.*

    - name: Application
      collectors:
        - type: classLike
          value: ^App\\Application\\.*

    - name: Infrastructure
      collectors:
        - type: classLike
          value: ^App\\Infrastructure\\.*

    - name: Presentation
      collectors:
        - type: classLike
          value: ^App\\Presentation\\.*

    # Standard Laravel code (Models, Providers, Http, Console).
    - name: Laravel
      collectors:
        - type: classLike
          value: ^App\\Models\\.*
        - type: classLike
          value: ^App\\Providers\\.*
        - type: classLike
          value: ^App\\Http\\.*
        - type: classLike
          value: ^App\\Console\\.*

    # Doctrine mapping attributes (#[ORM\Entity], #[ORM\Column], etc.).
    - name: DoctrineMapping
      collectors:
        - type: classLike
          value: ^Doctrine\\ORM\\Mapping\\.*

    # Ecotone public API: attributes (#[CommandHandler], #[EventHandler])
    # and bus interfaces (CommandBus, EventBus, DistributedBus).
    - name: EcotoneMessaging
      collectors:
        - type: classLike
          value: ^Ecotone\\Modelling\\Attribute\\.*
        - type: classLike
          value: ^Ecotone\\Messaging\\Attribute\\.*
        - type: classLike
          value: ^Ecotone\\Modelling\\CommandBus$
        - type: classLike
          value: ^Ecotone\\Modelling\\EventBus$
        - type: classLike
          value: ^Ecotone\\Modelling\\DistributedBus$

    # Framework and third-party libraries.
    # Explicitly exclude Doctrine mapping and Ecotone attribute namespaces
    # so they belong only to their dedicated layers above.
    - name: Framework
      collectors:
        - type: classLike
          value: ^Illuminate\\.*
        - type: classLike
          value: ^Laravel\\.*
        - type: classLike
          value: ^Doctrine\\(?!ORM\\Mapping).*
        - type: classLike
          value: ^Ecotone\\(?!Modelling\\Attribute|Messaging\\Attribute|Modelling\\CommandBus|Modelling\\EventBus|Modelling\\DistributedBus).*
        - type: classLike
          value: ^Symfony\\.*

    - name: Psr
      collectors:
        - type: classLike
          value: ^Psr\\.*

  ruleset:
    Domain:
      - Domain
      - DoctrineMapping

    Application:
      # Application handlers use Ecotone attributes for registration.
      - Domain
      - Application
      - EcotoneMessaging
      - Psr

    Infrastructure:
      - Domain
      - Application
      - Infrastructure
      - Framework
      - DoctrineMapping
      - EcotoneMessaging

    Presentation:
      - Domain
      - Application
      - Infrastructure
      - Presentation
      - Laravel
      - Framework
      - DoctrineMapping
      - EcotoneMessaging

    Laravel:
      - Domain
      - Application
      - Infrastructure
      - Laravel
      - Framework
      - DoctrineMapping
      - EcotoneMessaging

    DoctrineMapping:
      - DoctrineMapping

    EcotoneMessaging:
      - EcotoneMessaging
