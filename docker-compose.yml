services:
  # ============================================================
  # Order Service
  # ============================================================
  order-app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: mp-order-app
    working_dir: /var/www
    volumes:
      - ./services/order/src:/var/www
    networks:
      - mp-network
    depends_on:
      order-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SERVICE_NAME: "order"
      DB_HOST: order-db
      DB_PORT: "5432"
      DB_DATABASE: ${ORDER_DB_DATABASE}
      DB_USERNAME: ${ORDER_DB_USERNAME}
      DB_PASSWORD: ${ORDER_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: "/"

  order-web:
    image: nginx:alpine
    container_name: mp-order-web
    ports:
      - "8001:80"
    volumes:
      - ./services/order/src:/var/www
      - ./docker/nginx/order.conf:/etc/nginx/conf.d/default.conf
    networks:
      - mp-network
    depends_on:
      - order-app

  order-db:
    image: postgres:16-alpine
    container_name: mp-order-db
    environment:
      POSTGRES_DB: ${ORDER_DB_DATABASE}
      POSTGRES_USER: ${ORDER_DB_USERNAME}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
    volumes:
      - order-db-data:/var/lib/postgresql/data
    networks:
      - mp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDER_DB_USERNAME} -d ${ORDER_DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ============================================================
  # Payment Service
  # ============================================================
  payment-app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: mp-payment-app
    working_dir: /var/www
    volumes:
      - ./services/payment/src:/var/www
    networks:
      - mp-network
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SERVICE_NAME: "payment"
      DB_HOST: payment-db
      DB_PORT: "5432"
      DB_DATABASE: ${PAYMENT_DB_DATABASE}
      DB_USERNAME: ${PAYMENT_DB_USERNAME}
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: "/"

  payment-web:
    image: nginx:alpine
    container_name: mp-payment-web
    ports:
      - "8002:80"
    volumes:
      - ./services/payment/src:/var/www
      - ./docker/nginx/payment.conf:/etc/nginx/conf.d/default.conf
    networks:
      - mp-network
    depends_on:
      - payment-app

  payment-db:
    image: postgres:16-alpine
    container_name: mp-payment-db
    environment:
      POSTGRES_DB: ${PAYMENT_DB_DATABASE}
      POSTGRES_USER: ${PAYMENT_DB_USERNAME}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD}
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    networks:
      - mp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYMENT_DB_USERNAME} -d ${PAYMENT_DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ============================================================
  # Payout Service
  # ============================================================
  payout-app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: mp-payout-app
    working_dir: /var/www
    volumes:
      - ./services/payout/src:/var/www
    networks:
      - mp-network
    depends_on:
      payout-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SERVICE_NAME: "payout"
      DB_HOST: payout-db
      DB_PORT: "5432"
      DB_DATABASE: ${PAYOUT_DB_DATABASE}
      DB_USERNAME: ${PAYOUT_DB_USERNAME}
      DB_PASSWORD: ${PAYOUT_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: "/"

  payout-web:
    image: nginx:alpine
    container_name: mp-payout-web
    ports:
      - "8003:80"
    volumes:
      - ./services/payout/src:/var/www
      - ./docker/nginx/payout.conf:/etc/nginx/conf.d/default.conf
    networks:
      - mp-network
    depends_on:
      - payout-app

  payout-db:
    image: postgres:16-alpine
    container_name: mp-payout-db
    environment:
      POSTGRES_DB: ${PAYOUT_DB_DATABASE}
      POSTGRES_USER: ${PAYOUT_DB_USERNAME}
      POSTGRES_PASSWORD: ${PAYOUT_DB_PASSWORD}
    volumes:
      - payout-db-data:/var/lib/postgresql/data
    networks:
      - mp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYOUT_DB_USERNAME} -d ${PAYOUT_DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ============================================================
  # RabbitMQ
  # ============================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: mp-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - mp-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  mp-network:
    driver: bridge

volumes:
  order-db-data:
  payment-db-data:
  payout-db-data:
  rabbitmq-data: